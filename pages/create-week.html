<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
        <header class="topbar">

            <a
                href="#planner"
                class="logo"
            >

                <span class="brand-icon small">
                    SP
                </span>

                <span>
                    Semester Planner
                </span>

            </a>


            <nav class="navigation">

                <a href="#planner">
                    Overzicht
                </a>

                <a
                    href="#create-week"
                    class="active"
                >
                    Nieuwe week
                </a>

            </nav>

        </header>


        <main class="container narrow">

            <a
                href="#planner"
                class="back-link"
            >
                ← Terug naar overzicht
            </a>


            <div class="form-card">

                <div class="form-header">

                    <div class="form-icon">
                        +
                    </div>

                    <div>

                        <span class="eyebrow">
                            NIEUWE PLANNING
                        </span>

                        <h2>
                            Week aanmaken
                        </h2>

                        <p>
                            Voeg een nieuwe week toe aan je semester.
                        </p>

                    </div>

                </div>


                <form class="form">

                    <div class="input-group">

                        <label for="week-title">
                            Titel
                        </label>

                        <input
                            id="week-title"
                            type="text"
                            placeholder="Bijv. Week 3 - Frontend"
                        >

                    </div>


                    <div class="input-group">

                        <label for="week-description">
                            Beschrijving
                        </label>

                        <textarea
                            id="week-description"
                            rows="6"
                            placeholder="Beschrijf wat je deze week wilt bereiken..."
                        ></textarea>

                    </div>


                    <div class="input-row">

                        <div class="input-group">

                            <label for="week-start">
                                Startdatum
                            </label>

                            <input
                                id="week-start"
                                type="date"
                            >

                        </div>


                        <div class="input-group">

                            <label for="week-end">
                                Einddatum
                            </label>

                            <input
                                id="week-end"
                                type="date"
                            >

                        </div>

                    </div>


                    <div class="form-actions">

                        <a
                            href="#planner"
                            class="button button-secondary"
                        >
                            Annuleren
                        </a>

                        <a
                            href="#planner"
                            class="button button-primary"
                        >
                            Week opslaan
                        </a>

                    </div>

                </form>

            </div>

        </main>

    </section>

</body>
</html>
