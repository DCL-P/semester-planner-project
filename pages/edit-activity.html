<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <section id="edit-activity-1" class="screen">

        <header class="topbar">

            <a
                href="#planner"
                class="logo"
            >

                <span class="brand-icon small">
                    SP
                </span>

                <span>
                    Semester Planner
                </span>

            </a>

        </header>


        <main class="container narrow">

            <a
                href="#activity-1"
                class="back-link"
            >
                ← Terug naar activiteit
            </a>


            <div class="form-card">

                <div class="form-header">

                    <div class="form-icon">
                        ✎
                    </div>

                    <div>

                        <span class="eyebrow">
                            ACTIVITEIT BEWERKEN
                        </span>

                        <h2>
                            Project 2 voorbereiden
                        </h2>

                        <p>
                            Pas de activiteit aan en sla de wijzigingen op.
                        </p>

                    </div>

                </div>


                <form class="form">

                    <div class="input-group">

                        <label for="edit-title-1">
                            Titel
                        </label>

                        <input
                            id="edit-title-1"
                            type="text"
                            value="Project 2 voorbereiden"
                        >

                    </div>


                    <div class="input-group">

                        <label for="edit-description-1">
                            Beschrijving
                        </label>

                        <textarea
                            id="edit-description-1"
                            rows="6"
                        >Onderzoek uitvoeren naar de beroepsrol Frontend Developer en de belangrijkste vaardigheden en technologieën verzamelen.</textarea>

                    </div>


                    <div class="input-group">

                        <label for="edit-status-1">
                            Status
                        </label>

                        <select id="edit-status-1">

                            <option selected>
                                Afgerond
                            </option>

                            <option>
                                Bezig
                            </option>

                            <option>
                                Open
                            </option>

                        </select>

                    </div>


                    <div class="form-actions">

                        <a
                            href="#activity-1"
                            class="button button-secondary"
                        >
                            Annuleren
                        </a>

                        <a
                            href="#activity-1"
                            class="button button-primary"
                        >
                            Wijzigingen opslaan
                        </a>

                    </div>

                </form>

            </div>

        </main>

    </section>
</body>
</html>
