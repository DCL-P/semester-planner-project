<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <section id="create-activity-1" class="screen">

        <header class="topbar">

            <a
                href="#planner"
                class="logo"
            >

                <span class="brand-icon small">
                    SP
                </span>

                <span>
                    Semester Planner
                </span>

            </a>

        </header>


        <main class="container narrow">

            <a
                href="#week-1"
                class="back-link"
            >
                ← Terug naar Week 1
            </a>


            <div class="form-card">

                <div class="form-header">

                    <div class="form-icon">
                        +
                    </div>

                    <div>

                        <span class="eyebrow">
                            WEEK 01
                        </span>

                        <h2>
                            Activiteit aanmaken
                        </h2>

                        <p>
                            Voeg een nieuwe activiteit toe aan je week.
                        </p>

                    </div>

                </div>


                <form class="form">

                    <div class="input-group">

                        <label for="activity-title-1">
                            Titel
                        </label>

                        <input
                            id="activity-title-1"
                            type="text"
                            placeholder="Bijv. Portfolio maken"
                        >

                    </div>


                    <div class="input-group">

                        <label for="activity-description-1">
                            Beschrijving
                        </label>

                        <textarea
                            id="activity-description-1"
                            rows="6"
                            placeholder="Wat moet je doen?"
                        ></textarea>

                    </div>


                    <div class="input-group">

                        <label for="activity-status-1">
                            Status
                        </label>

                        <select id="activity-status-1">

                            <option>
                                Open
                            </option>

                            <option>
                                Bezig
                            </option>

                            <option>
                                Afgerond
                            </option>

                        </select>

                    </div>


                    <div class="form-actions">

                        <a
                            href="#week-1"
                            class="button button-secondary"
                        >
                            Annuleren
                        </a>

                        <a
                            href="#week-1"
                            class="button button-primary"
                        >
                            Activiteit opslaan
                        </a>

                    </div>

                </form>

            </div>

        </main>

    </section>
</body>
</html>
