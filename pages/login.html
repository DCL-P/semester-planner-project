<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section id="login" class="screen login-screen">

        <div class="login-card">

            <div class="brand">

                <div class="brand-icon">
                    SP
                </div>

                <div>
                    <span class="eyebrow">
                        STUDENT TOOL
                    </span>

                    <h1>
                        Semester Planner
                    </h1>
                </div>

            </div>

            <p class="login-description">
                Log in om je semester, weken en activiteiten te beheren.
            </p>


            <form class="form">

                <div class="input-group">

                    <label for="email">
                        E-mailadres
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="naam@student.nl"
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Wachtwoord
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="••••••••"
                    >

                </div>


                <a
                    href="#planner"
                    class="button button-primary button-full"
                >
                    Inloggen
                </a>

            </form>


            <p class="login-footer">
                Semester Planner · Open ICT
            </p>

        </div>

    </section>
</body>
</html>
